spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: payment-service
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-retries: 2
        default-requeue-rejected: false

