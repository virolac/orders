spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: orders
  datasource:
    url: "jdbc:postgresql://localhost:5432/${POSTGRES_DB}"
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

