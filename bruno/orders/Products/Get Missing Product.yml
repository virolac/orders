info:
  name: Get Missing Product
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/products/1000000"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
