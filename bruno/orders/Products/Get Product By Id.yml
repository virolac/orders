info:
  name: Get Product By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
