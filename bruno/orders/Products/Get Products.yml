info:
  name: Get Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/products"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
