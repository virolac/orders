info:
  name: Create Product
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/products"
  body:
    type: json
    data: |-
      {
        "name": "Chanel Coco Noir Eau De",
        "price": 129.99
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const product = res.getBody();
        bru.setVar("productId", product.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
