info:
  name: Delete Product In Use
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/api/products/{{orderedProductId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
